# Data Storage Layer writer: observations, events and forecasts into PostgreSQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recorder
  labels: { app.kubernetes.io/name: recorder }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: recorder }
  template:
    metadata:
      labels: { app.kubernetes.io/name: recorder }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8083" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: recorder
          image: nexus-city/recorder:dev
          envFrom: [{ configMapRef: { name: nexus-config } }]
          env:
            - { name: RECORDER_HEALTH_ADDR, value: ":8083" }
            - { name: GOMEMLIMIT, value: 200MiB }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: nexus-secrets, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://nexus:$(POSTGRES_PASSWORD)@postgres:5432/nexus?sslmode=disable" }
          ports: [{ name: http, containerPort: 8083 }]
          # Waits for PostgreSQL before serving health checks; on a fresh
          # cluster its first start takes ~30 s, so give it up to 3 minutes.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
