# Next.js command center. The browser calls the gateway directly; its URL
# is baked into the image at build time (NEXT_PUBLIC_GATEWAY_URL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: nexus-city/web:dev
          ports: [{ name: http, containerPort: 3000 }]
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web }
spec:
  selector: { app.kubernetes.io/name: web }
  ports: [{ name: http, port: 3000, targetPort: http }]
