# City Intelligence. Without LLM_API_KEY in nexus-secrets it runs in
# rule-based mode. Reached through the gateway at /api/assistant/*.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  labels: { app.kubernetes.io/name: assistant }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: assistant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: assistant }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8095" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: assistant
          image: nexus-city/assistant:dev
          env:
            - name: GATEWAY_URL
              valueFrom: { configMapKeyRef: { name: nexus-config, key: GATEWAY_URL } }
            - { name: ASSISTANT_HOST, value: 0.0.0.0 }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: nexus-secrets, key: LLM_API_KEY, optional: true } }
          ports: [{ name: http, containerPort: 8095 }]
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: assistant
  labels: { app.kubernetes.io/name: assistant }
spec:
  selector: { app.kubernetes.io/name: assistant }
  ports: [{ name: http, port: 8095, targetPort: http }]
