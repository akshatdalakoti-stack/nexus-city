# Prometheus, scraping every pod in this namespace that has the
# prometheus.io/scrape annotation. Namespace-scoped RBAC only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  labels: { app.kubernetes.io/name: prometheus }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  labels: { app.kubernetes.io/name: prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery }
subjects: [{ kind: ServiceAccount, name: prometheus }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: { app.kubernetes.io/name: prometheus }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: nexus-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: { own_namespace: true }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: drop
            regex: Pending|Succeeded|Failed
          # One target per pod, on the annotated port.
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: component
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
      # Prometheus discovers and scrapes itself like every other pod.
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9090" }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=12h
            - --storage.tsdb.retention.size=400MB
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        # Metrics history is short-lived on purpose (12 h, max 400 MB).
        - { name: data, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
