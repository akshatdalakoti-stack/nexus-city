[project]
name = "nexus-assistant"
version = "0.4.0"
description = "City Intelligence assistant for Nexus City: tools over the gateway API, an OpenAI-compatible LLM, and a deterministic fallback"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "openai>=1.60",
  "pydantic>=2.9",
  "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
nexus-assistant = "nexus_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
